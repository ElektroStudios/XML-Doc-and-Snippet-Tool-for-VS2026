# ------------------------------------------
# CUSTOMIZABLE TEMPLATE REPOSITORY VARIABLES
# 
environment:
  APP_DIR_NAME: "Snippet Tool 2026"
  SOLUTION_EXT: "slnx"
# ------------------------------------------

version: CI Build {Build}
skip_commits:
  files:
  - '.github/**/*'
  - 'Docs/**/*'
  - 'Documents/**/*'
  - 'Manual/**/*'
  - 'Images/**/*'
  - 'Scripts/**/*'
  - 'Website/**/*'
  - '*.md'
  - '*.zip'
  - '*.yml'
image: Visual Studio 2026
configuration: Release

install:
  - choco install dotnet-10.0-sdk --no-progress -y
  - >-
    choco install chocolatey-dotnetfx.extension --no-progress -y
  - >-
    git submodule update --init --recursive

before_build:
  - dotnet nuget locals all --clear
  - >-
    nuget restore "Source\%APP_DIR_NAME%.%SOLUTION_EXT%"

build:
  project: Source\%APP_DIR_NAME%.%SOLUTION_EXT%
  parallel: true

test_script:
  - dotnet test "Source\%APP_DIR_NAME%.Tests\%APP_DIR_NAME%.Tests.vbproj" --configuration Release --no-build --logger trx

after_build:
  - >-
    7z a -r "%APPVEYOR_PROJECT_NAME%_Build_%APPVEYOR_BUILD_NUMBER%.zip"
    -i!"Source\*\bin\*"
    -x!"Source\Tests\bin\*"
    -x!"Source\*.Tests\bin\*"

artifacts:
  - path: "%APPVEYOR_PROJECT_NAME%_Build_%APPVEYOR_BUILD_NUMBER%.zip"
    name: "%APPVEYOR_PROJECT_NAME%"
